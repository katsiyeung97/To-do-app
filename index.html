<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>to/do</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="to/do" />
<meta name="theme-color" content="#4F6E84" />

<style>
  html, body { margin: 0; padding: 0; background: #4F6E84; }
  #root { min-height: 100vh; }
  #boot-fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #F6F3E9; font-family: serif; font-size: 15px; background: #4F6E84;
  }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
  (function () {
    var PREFIX = "todo-app:";
    window.storage = {
      get: function (key) {
        return new Promise(function (resolve, reject) {
          try {
            var raw = localStorage.getItem(PREFIX + key);
            if (raw === null) { resolve(null); return; }
            resolve({ key: key, value: raw, shared: false });
          } catch (e) { reject(e); }
        });
      },
      set: function (key, value) {
        return new Promise(function (resolve, reject) {
          try {
            localStorage.setItem(PREFIX + key, value);
            resolve({ key: key, value: value, shared: false });
          } catch (e) { reject(e); }
        });
      },
      delete: function (key) {
        return new Promise(function (resolve, reject) {
          try {
            localStorage.removeItem(PREFIX + key);
            resolve({ key: key, deleted: true, shared: false });
          } catch (e) { reject(e); }
        });
      },
      list: function (prefix) {
        return new Promise(function (resolve, reject) {
          try {
            var full = PREFIX + (prefix || "");
            var keys = Object.keys(localStorage)
              .filter(function (k) { return k.indexOf(full) === 0; })
              .map(function (k) { return k.slice(PREFIX.length); });
            resolve({ keys: keys, prefix: prefix || null, shared: false });
          } catch (e) { reject(e); }
        });
      }
    };
  })();

  function showBootError(stage, err) {
    var el = document.getElementById("boot-fallback");
    if (!el) return;
    el.style.textAlign = "left";
    el.style.padding = "24px";
    el.style.fontFamily = "monospace";
    el.style.fontSize = "13px";
    el.style.whiteSpace = "pre-wrap";
    el.textContent = "Failed at: " + stage + "\n\n" + (err && err.message ? err.message : String(err));
  }
  window.addEventListener("error", function (e) {
    showBootError("runtime", e.error || e.message);
  });
  window.addEventListener("unhandledrejection", function (e) {
    showBootError("promise", e.reason);
  });

  (async function boot() {
    try {
      window.LucideReact = await import("https://esm.sh/lucide-react@0.383.0?deps=react@18,react-dom@18");
    } catch (e) {
      showBootError("loading icon library", e);
      return;
    }
    var script = document.createElement("script");
    script.src = "app.js";
    script.onerror = function () {
      showBootError("loading app.js", new Error("Could not load app.js — check it's sitting next to index.html in the repo"));
    };
    document.body.appendChild(script);
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (e) {
        console.warn("Service worker registration failed:", e);
      });
    });
  }
</script>
</head>
<body>
  <div id="root"><div id="boot-fallback">loading…</div></div>
</body>
</html>
